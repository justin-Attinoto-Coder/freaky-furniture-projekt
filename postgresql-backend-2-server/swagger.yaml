openapi: 3.0.0
info:
  title: Furniture Store API
  version: 1.0.0
  description: API documentation for the furniture store backend (PostgreSQL + Sequelize)
servers:
  - url: http://localhost:3000/api
paths:
  /products:
    get:
      summary: Get paginated list of products
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      summary: Create a new product (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Bad request
  /products/{id}:
    get:
      summary: Get product by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product not found
    patch:
      summary: Update product (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductPatch'
      responses:
        '204':
          description: Product updated
        '400':
          description: Bad request
    delete:
      summary: Delete product (admin only)
      responses:
        '204':
          description: Product deleted
        '404':
          description: Product not found
  /products:
    get:
      summary: Get product by slug
      parameters:
        - in: query
          name: slug
          schema:
            type: string
      responses:
        '200':
          description: Product found or empty list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
  /categories:
    get:
      summary: Get all categories
      responses:
        '200':
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
    post:
      summary: Create a new category (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: Bad request
  /categories/{id}:
    get:
      summary: Get category by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Category found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '404':
          description: Category not found
    patch:
      summary: Update category (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryPatch'
      responses:
        '204':
          description: Category updated
        '400':
          description: Bad request
    delete:
      summary: Delete category (admin only)
      responses:
        '204':
          description: Category deleted
        '404':
          description: Category not found
  /categories:
    get:
      summary: Get category by slug
      parameters:
        - in: query
          name: slug
          schema:
            type: string
      responses:
        '200':
          description: Category found or empty list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
  /categories/{categoryID}/products/{productId}:
    put:
      summary: Add product to category (admin only)
      responses:
        '204':
          description: Product added to category
    delete:
      summary: Remove product from category (admin only)
      responses:
        '204':
          description: Product removed from category
  /auth/login:
    post:
      summary: Login and get JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Unauthorized
components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: integer
        namn:
          type: string
        description:
          type: string
        price:
          type: integer
        image:
          type: string
        slug:
          type: string
    ProductInput:
      type: object
      required:
        - namn
        - description
        - price
        - image
        - slug
      properties:
        namn:
          type: string
        description:
          type: string
        price:
          type: integer
        image:
          type: string
        slug:
          type: string
    ProductPatch:
      type: object
      properties:
        op:
          type: string
        path:
          type: string
        value:
          type: string
    Category:
      type: object
      properties:
        id:
          type: integer
        namn:
          type: string
        image:
          type: string
        slug:
          type: string
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
    CategoryInput:
      type: object
      required:
        - namn
        - image
        - slug
      properties:
        namn:
          type: string
        image:
          type: string
        slug:
          type: string
    CategoryPatch:
      type: object
      properties:
        op:
          type: string
        path:
          type: string
        value:
          type: string
    LoginInput:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
