<button
  type="button"
  class="go-to-cart-btn relative inline-flex items-center justify-center gap-2 font-semibold rounded-lg transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed"
  [class]="getButtonClasses()"
  (click)="goToCart()"
  [title]="buttonText">

  <i *ngIf="showIcon" class="fas fa-shopping-cart"></i>

  <span class="button-text">{{ buttonText }}</span>

  <!-- Cart count badge -->
  <span
    *ngIf="showCartCount && (cartItemCount$ | async) && (cartItemCount$ | async)! > 0"
    class="cart-badge absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold rounded-full min-w-[20px] h-5 flex items-center justify-center px-1">
    {{ cartItemCount$ | async }}
  </span>
</button>
