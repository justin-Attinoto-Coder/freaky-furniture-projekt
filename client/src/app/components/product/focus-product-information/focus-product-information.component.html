<div class="product-information p-4 relative sm:w-1/2">
  <h2 class="text-2xl font-bold mb-2">{{ product.name }}</h2>
  <div class="flex justify-between items-center mb-2">
    <h3 class="text-xl text-gray-700 truncate w-3/4">{{ product.brand }}</h3>
    <p class="text-xl font-semibold">${{ product.price }}</p>
  </div>
  <div class="product-rating flex items-center mb-4">
    <span *ngFor="let _ of [1, 2, 3, 4, 5]; let i = index" class="text-2xl">
      <fa-icon
        [icon]="i < averageRating ? faStar : faRegStar"
        [ngClass]="i < averageRating ? 'text-yellow-500' : 'text-gray-300'"
      ></fa-icon>
    </span>
    <a [routerLink]="['/product', product.urlSlug, 'reviews']" class="text-blue-500 underline ml-4">See all reviews</a>
  </div>
  <p class="text-gray-600 mb-4">{{ product.description }}</p>
  
  <!-- Add to Cart Section -->
  <div class="add-to-cart-section">
    <div class="quantity-selector">
      <label for="quantity">Antal:</label>
      <select id="quantity" [(ngModel)]="quantity" class="quantity-select">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
      </select>
    </div>
    
    <!-- Button Container with both buttons -->
    <div class="cart-buttons-container flex gap-3 items-center flex-wrap">
      <app-add-to-cart-button 
        [product]="product"
        [quantity]="quantity"
        class="flex-1 min-w-[200px]">
      </app-add-to-cart-button>
      
      <!-- Go to Cart Button -->
      <app-go-to-cart
        variant="secondary"
        size="md"
        [showCartCount]="true"
        buttonText="Se kundvagn">
      </app-go-to-cart>
    </div>
  </div>

  <app-focus-overview-accordion [product]="product" [reviews]="reviews" class="mt-8 sm:mt-16"></app-focus-overview-accordion>
</div>
